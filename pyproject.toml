[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "simplex-codes"
dynamic = ["version"]
description = "Educational linear programming solvers and simplex visualization tools."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Melih" }]
dependencies = ["numpy>=1.24"]
keywords = ["simplex", "linear-programming", "optimization", "operations-research"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.scripts]
simplex-solve = "simplex_codes._cli:main"
simplex-app = "simplex_codes._app:main"

[project.optional-dependencies]
api = ["fastapi>=0.115", "prometheus-client>=0.21", "pydantic>=2.10", "uvicorn>=0.32"]
browser = ["playwright>=1.50"]
compare = ["scipy>=1.10"]
dev = ["build>=1.2", "httpx>=0.28", "pytest>=8"]
viz = ["matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/melih545/or-simplex-solvers"
Issues = "https://github.com/melih545/or-simplex-solvers/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "simplex_codes._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simplex_codes = ["_web/*.html", "_web/*.css", "_web/*.js", "_web/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
