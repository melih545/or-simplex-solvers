name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Install wheel with test and example dependencies
        run: |
          wheels=(dist/*.whl)
          python -m pip install "${wheels[0]}[api,compare,dev,viz]"
      - name: Run tests
        run: python -m pytest
      - name: Run the installed CLI
        run: |
          printf '%s\n' '{"c":[1],"A":[[1]],"b":[2],"sense":"max"}' | simplex-solve
      - name: Run workbench browser tests
        if: matrix.python-version == '3.12'
        run: |
          wheels=(dist/*.whl)
          python -m pip install "${wheels[0]}[browser]"
          python -m playwright install --with-deps chromium
          python -m pytest browser_tests
      - name: Run installed-package examples
        working-directory: ${{ runner.temp }}
        env:
          MPLBACKEND: Agg
        run: |
          for example in "$GITHUB_WORKSPACE"/examples/*_example.py; do
            python "$example"
          done
          python "$GITHUB_WORKSPACE/examples/simplex_visualization.py"
          test -s simplex-path.png

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the workbench and monitoring stack
        run: docker compose up --build --wait
      - name: Verify the running stack
        run: python3 scripts/smoke_stack.py
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down
